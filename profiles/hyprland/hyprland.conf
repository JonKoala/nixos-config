# https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# https://wiki.hyprland.org/Configuring/Master-Layout/
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#####################
### WINDOWS RULES ###
#####################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule = match:class Rofi, rounding 0 

windowrulev2 = tile, class:Aseprite

# Unity's menus
windowrule = match:class Unity, match:title Project Settings, min_size 1280 720, center on
windowrule = match:class Unity, match:title Preferences, min_size 1280 720, center on
windowrule = match:class Unity, match:title Select.*, stay_focused on, move (window_w+20) (cursor_y-(window_h*0.5))
windowrule = match:class Unity, match:title Package Manager, min_size 1024 768
windowrule = match:class Unity, match:title Animation, min_size 1024 768

# Steam's windows
windowrule = match:class steam, match:title Friends List, float on, center on, size 384 768
windowrule = match:class steam, match:title Steam Settings, float on, center on, size 1280 768

## DEFAULT

# Ignore maximize requests from all apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

